<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ambulator - Book an Appointment</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 2rem 1rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        h1 { font-size: 4rem; font-weight: bold; margin: 0 0 1rem 0; }
        .doctor { font-size: 2.5rem; margin: 0 0 0.75rem 0; }
        .hours { font-size: 2rem; margin: 0 0 2rem 0; }
        .qr { width: 350px; height: 350px; }
        .hint { font-size: 1rem; color: #555; margin-top: 2rem; }

        /* Print layout: drop on-screen-only helpers and browser-added
           headers/footers so the page prints as a clean centered sign. */
        @media print {
            @page { margin: 1cm; }
            body { padding: 0; min-height: auto; }
            .hint { display: none; }
        }
    </style>
</head>
<body>
    <h1>Ambulator</h1>
    <p class="doctor">Dr. Elena Serban</p>
    <p class="hours">Program: 14:00 - 15:00</p>

    <img class="qr" src="{{ url_for('static', filename='qr_code.png') }}"
         alt="QR code linking to the appointment booking page">

    <p class="hint">Scan to book an appointment</p>
</body>
</html>
