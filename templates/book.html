<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Book an Appointment</title>
    <style>
        body { font-family: sans-serif; max-width: 32rem; margin: 2rem auto; padding: 0 1rem; }
        label { display: block; margin-top: 1rem; font-weight: bold; }
        input, select { width: 100%; padding: 0.4rem; margin-top: 0.25rem; box-sizing: border-box; }
        button { margin-top: 1.25rem; padding: 0.5rem 1rem; }
        .error { color: #b00020; background: #fde7ea; padding: 0.75rem; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Book an Appointment</h1>

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post" action="{{ url_for('book') }}">
        <label for="patient_name">Name</label>
        <input type="text" id="patient_name" name="patient_name"
               value="{{ form.patient_name if form else '' }}" required>

        <label for="patient_contact">Contact (phone or email)</label>
        <input type="text" id="patient_contact" name="patient_contact"
               value="{{ form.patient_contact if form else '' }}" required>

        <label for="appointment_date">Date</label>
        <input type="date" id="appointment_date" name="appointment_date"
               min="{{ today }}"
               value="{{ form.appointment_date if form else '' }}" required>

        <label for="appointment_time">Time</label>
        <select id="appointment_time" name="appointment_time" required>
            <option value="" disabled {{ 'selected' if not form or not form.appointment_time else '' }}>
                Select a time
            </option>
            {% for slot in time_slots %}
            <option value="{{ slot }}"
                    {{ 'selected' if form and form.appointment_time == slot else '' }}>
                {{ slot }}
            </option>
            {% endfor %}
        </select>

        <button type="submit">Book</button>
    </form>
</body>
</html>
