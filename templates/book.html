<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Book an Appointment</title>
</head>
<body>
    <h1>Book an Appointment</h1>

    {% if booked %}
    <p style="color: green;">Your appointment has been booked.</p>
    {% endif %}

    {% if error %}
    <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="post" action="{{ url_for('book') }}">
        <p>
            <label for="patient_name">Name</label><br>
            <input type="text" id="patient_name" name="patient_name"
                   value="{{ form.patient_name if form else '' }}" required>
        </p>
        <p>
            <label for="patient_contact">Contact (phone or email)</label><br>
            <input type="text" id="patient_contact" name="patient_contact"
                   value="{{ form.patient_contact if form else '' }}" required>
        </p>
        <p>
            <label for="appointment_date">Date</label><br>
            <input type="date" id="appointment_date" name="appointment_date"
                   value="{{ form.appointment_date if form else '' }}" required>
        </p>
        <p>
            <label for="appointment_time">Time</label><br>
            <input type="time" id="appointment_time" name="appointment_time"
                   value="{{ form.appointment_time if form else '' }}" required>
        </p>
        <p>
            <button type="submit">Book</button>
        </p>
    </form>
</body>
</html>
