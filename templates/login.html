<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Staff Login</title>
    <style>
        body { font-family: sans-serif; max-width: 24rem; margin: 4rem auto; padding: 0 1rem; }
        label { display: block; margin-top: 1rem; font-weight: bold; }
        input { width: 100%; padding: 0.4rem; margin-top: 0.25rem; box-sizing: border-box; }
        button { margin-top: 1.25rem; padding: 0.5rem 1rem; }
        .error { color: #b00020; background: #fde7ea; padding: 0.75rem; border-radius: 4px; }
        .notice { color: #1b5e20; background: #e8f5e9; padding: 0.75rem; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Staff Login</h1>

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    {% if message %}
    <p class="notice">{{ message }}</p>
    {% endif %}

    <form method="post" action="{{ url_for('login') }}">
        {% if next %}
        <input type="hidden" name="next" value="{{ next }}">
        {% endif %}

        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>

        <button type="submit">Log In</button>
    </form>
</body>
</html>
